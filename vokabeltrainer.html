<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vokabeln üben – Português</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1410">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Português">
<link rel="apple-touch-icon" href="icons/icon-apple.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif; background: #0d1410; color: #ecefea; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  .app { max-width: 480px; margin: 0 auto; padding: 18px 18px 24px; }

  .kopf { display: flex; align-items: center; gap: 10px; margin: 2px 2px 16px; }
  .kopf .zurueck { font-size: 22px; line-height: 1; color: #9da89f; padding: 4px 8px 4px 0; }
  .kopf h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; flex: 1; }
  .kopf .zaehler { font-size: 13px; font-weight: 600; color: #9da89f; font-variant-numeric: tabular-nums; }

  .balken { height: 4px; background: #26382b; border-radius: 4px; overflow: hidden; margin-bottom: 18px; }
  .balken i { display: block; height: 100%; background: #5fa86b; border-radius: 4px; transition: width .25s ease;  color: #0d1410; }

  /* ---------- Startbildschirm ---------- */
  .start h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 6px; }
  .start p.lead { font-size: 14px; color: #b4bfb7; line-height: 1.6; margin-bottom: 18px; }
  .kacheln { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
  .kachel { background: #16221a; border-radius: 8px; padding: 12px 8px; text-align: center; border: 1px solid #26382b; }
  .kachel b { display: block; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .kachel span { display: block; font-size: 11px; color: #9da89f; margin-top: 2px; line-height: 1.3; }
  .kachel.gut b { color: #5fa86b; } .kachel.mittel b { color: #d9a648; } .kachel.schwach b { color: #e2695f; }

  .knopf { display: block; width: 100%; border: 0; border-radius: 8px; padding: 16px; font: inherit;
           font-size: 16px; font-weight: 700; cursor: pointer; text-align: center; }
  .knopf.haupt { background: linear-gradient(145deg, #23402a, #16221a); color: #ecefea; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); }
  .knopf.neben { background: #16221a; color: #ecefea; border: 1px solid #26382b; margin-top: 10px; font-weight: 600; font-size: 15px; }

  .wahl { margin: 18px 0 6px; }
  .wahl label { display: block; font-size: 12px; font-weight: 700; color: #9da89f; text-transform: uppercase;
                letter-spacing: .5px; margin-bottom: 8px; }
  .wahl select { width: 100%; font: inherit; font-size: 15px; padding: 12px 14px; border-radius: 8px;
                 border: 1px solid #26382b; background: #16221a; -webkit-appearance: none; appearance: none; }
  .wahl .reihe { display: flex; gap: 8px; }

  .arten { display: grid; gap: 8px; }
  .art {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: #16221a; border: 1px solid #26382b; border-radius: 8px;
    padding: 13px 15px; font: inherit; color: #ecefea;
  }
  .art b { font-size: 15.5px; font-weight: 700; }
  .art span { float: right; font-size: 12.5px; color: #8c988f; font-variant-numeric: tabular-nums; }
  .art small { display: block; font-size: 12.5px; color: #8c988f; line-height: 1.45; margin-top: 3px; }
  .art.aktiv { border-color: #5fa86b; background: #15291a; }
  .art.aktiv b { color: #5fa86b; }

  .feinwahl { margin-top: 14px; }
  .feinwahl summary { font-size: 13px; color: #8c988f; cursor: pointer; padding: 6px 2px; }
  .feinwahl .reihe { display: flex; gap: 8px; margin-top: 8px; }
  .wahl .reihe select { flex: 1; }

  /* ---------- Karte ---------- */
  .karte { background: #16221a; border-radius: 10px; padding: 26px 20px; min-height: 210px;
           display: flex; flex-direction: column; justify-content: center; align-items: center;
           text-align: center; border: 1px solid #26382b; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4); }
  .karte .marke { font-size: 11px; font-weight: 700; color: #8c988f; text-transform: uppercase;
                  letter-spacing: .6px; margin-bottom: 14px; }
  .karte .frage { font-size: 26px; font-weight: 700; line-height: 1.3; letter-spacing: -0.4px; }
  .karte .frage.klein { font-size: 20px; line-height: 1.4; }
  .karte .hilf { font-size: 13.5px; color: #9da89f; margin-top: 10px; line-height: 1.5; }
  .karte .antwort { font-size: 24px; font-weight: 700; color: #5fa86b; margin-top: 16px; line-height: 1.3; }
  .karte .antwort.falsch { color: #e2695f; }
  .karte hr { border: 0; border-top: 1px solid #26382b; width: 60%; margin: 16px 0 0; }
  .notiz { background: #2a2113; border: 1px solid #3a2e18; border-radius: 8px; padding: 13px 15px;
           font-size: 13.5px; line-height: 1.6; color: #b4bfb7; margin-top: 12px; }

  .eingabe { width: 100%; font: inherit; font-size: 17px; padding: 14px 16px; border-radius: 8px;
             border: 2px solid #26382b; background: #16221a; margin-top: 16px; text-align: center; }
  .eingabe:focus { outline: none; border-color: #1b371f; }

  .noten { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .note { border: 0; border-radius: 8px; padding: 15px 6px; font: inherit; font-size: 14px; font-weight: 700;
          cursor: pointer; color: #0d1410; line-height: 1.25; }
  .note small { display: block; font-size: 11px; font-weight: 500; opacity: .7; margin-top: 3px; }
  .note.n0 { background: #e2695f;  color: #0d1410; } .note.n1 { background: #d9a648;  color: #0d1410; } .note.n2 { background: #5fa86b;  color: #0d1410; }

  .zeigen { margin-top: 14px; }
  .tipp { text-align: center; font-size: 12.5px; color: #8c988f; margin-top: 12px; line-height: 1.5; }
  .tippfehler { display: block; width: 100%; margin-top: 10px; background: #16221a; border: 1px solid #26382b;
                border-radius: 8px; padding: 11px; font: inherit; font-size: 13.5px; color: #9da89f; cursor: pointer; }

  /* ---------- Schluss ---------- */
  .schluss { text-align: center; padding: 10px 0; }
  .schluss .gross { font-size: 44px; font-weight: 800; letter-spacing: -1px; }
  .schluss h2 { font-size: 20px; font-weight: 800; margin: 8px 0 6px; }
  .schluss p { font-size: 14px; color: #b4bfb7; line-height: 1.6; margin-bottom: 18px; }

  .hinweis { background: #2a2113; border: 1px solid #3a2e18; border-radius: 8px; padding: 11px 14px;
             font-size: 12.5px; line-height: 1.55; color: #d9a648; margin-top: 14px; }
  .versteckt { display: none !important; }
</style>
<link rel="stylesheet" href="css/app-shell.css?v=20261003a">
<script>
  /* Die Aufgabendatei braucht keines der Skripte, also wird sie sofort
     angefordert statt erst nach ihnen. Gemessen auf der echten Seite sparte
     das rund 450 Millisekunden beim kalten Start.
     KEIN link rel=preload: das lädt die Datei in Chrome zweimal. */
  window.__ptDaten = fetch('daten/trainer.json?v=20261003a').then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
  window.__ptDaten.catch(function () {});
</script>
</head>
<body>
<div class="app">

  <div class="kopf">
    <a class="zurueck" href="lernen.html" id="zurueck" aria-label="Zurück">&#8249;</a>
    <h1 id="titel">Vokabeln üben</h1>
    <span class="zaehler versteckt" id="zaehler"></span>
  </div>
  <div class="balken versteckt" id="balken"><i style="width:0%"></i></div>

  <!-- ============ Start ============ -->
  <section class="start" id="start">
    <h2 id="startTitel">Los geht's</h2>
    <p class="lead" id="startText">Einen Moment, die Aufgaben werden geladen.</p>

    <div class="kacheln" id="kacheln"></div>

    <div class="wahl">
      <label>Was möchtest du üben?</label>
      <div class="arten" id="artWahl">
        <button type="button" class="art" data-art="vokabeln">
          <b>Vokabeln</b><span id="zVokabeln"></span>
          <small>Substantive, Verben, Adjektive. Ein Wort, eine Bedeutung.</small>
        </button>
        <button type="button" class="art" data-art="wendungen">
          <b>Wendungen</b><span id="zWendungen"></span>
          <small>Feste Verbindungen und die kleinen Gesprächswörter.</small>
        </button>
        <button type="button" class="art" data-art="formen">
          <b>Verbformen</b><span id="zFormen"></span>
          <small>Konjugation. Du tippst die Form selbst.</small>
        </button>
        <button type="button" class="art" data-art="grammatik">
          <b>Grammatik</b><span id="zGrammatik"></span>
          <small>Regeln und Lückensätze zum Ausfüllen.</small>
        </button>
        <button type="button" class="art" data-art="saetze">
          <b>Ganze Sätze</b><span id="zSaetze"></span>
          <small>Muster aus deinen Klassen, zum Nachbauen.</small>
        </button>
        <button type="button" class="art" data-art="alle">
          <b>Alles gemischt</b><span id="zAlle"></span>
          <small>Querbeet, wenn du schon warm bist.</small>
        </button>
      </div>
    </div>

    <button class="knopf haupt" id="losKnopf">Üben</button>
    <button class="knopf neben versteckt" id="nurNeuKnopf">Nur neue Wörter ansehen</button>

    <details class="feinwahl">
      <summary>Genauer einstellen</summary>
      <div class="reihe">
        <select id="paketWahl"></select>
        <select id="zielWahl">
          <option value="10">10 Stück</option>
          <option value="20" selected>20 Stück</option>
          <option value="40">40 Stück</option>
        </select>
      </div>
    </details>

    <div class="hinweis versteckt" id="startHinweis"></div>
  </section>

  <!-- ============ Übung ============ -->
  <section class="versteckt" id="uebung">
    <div class="karte" id="karte">
      <div class="marke" id="marke"></div>
      <div class="frage" id="frage"></div>
      <div class="hilf versteckt" id="hilf"></div>
      <div class="antwort versteckt" id="antwort"></div>
    </div>

    <input class="eingabe versteckt" id="eingabe" type="text" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Form eintippen">

    <div class="notiz versteckt" id="notiz"></div>

    <button class="knopf haupt zeigen" id="zeigenKnopf">Antwort zeigen</button>
    <button class="tippfehler versteckt" id="tippfehlerKnopf">Das war nur ein Tippfehler</button>

    <div class="noten versteckt" id="noten">
      <button class="note n0" data-note="0">Nicht gut<small>bald wieder</small></button>
      <button class="note n1" data-note="1">Geht so<small>in ein paar Tagen</small></button>
      <button class="note n2" data-note="2">Sitzt<small>länger Ruhe</small></button>
    </div>

    <p class="tipp" id="tipp"></p>
    <button class="tippfehler" id="genugKnopf" style="margin-top:16px">Genug für heute</button>
  </section>

  <!-- ============ Schluss ============ -->
  <section class="schluss versteckt" id="schluss">
    <div class="gross" id="schlussZahl">0</div>
    <h2 id="schlussTitel">Fertig</h2>
    <p id="schlussText"></p>
    <button class="knopf haupt" id="weiterKnopf">Weiter</button>
    <a class="knopf neben" href="lernen.html">Für heute reicht's</a>
  </section>

</div>

<script src="js/progress.js?v=20261003a"></script>
<script src="js/vorlesen.js?v=20261003a"></script>
<script src="js/srs.js?v=20261003a"></script>
<script src="js/leistungstest.js?v=20261003a"></script>
<script src="js/vokabel-sync.js?v=20261003a"></script>
<script src="js/vokabeltrainer.js?v=20261003a"></script>
<script src="js/app-shell.js?v=20261003a"></script>
</body>
</html>
